# ===== Smart Food Mini App — nginx (rendered from template at container start) =====
# ${BACKEND_ORIGIN} is substituted by the official nginx image's envsubst step.
# nginx runtime variables ($uri, $host, …) are NOT env vars, so they survive.

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;

    # Don't leak the nginx version.
    server_tokens off;

    # Health probe for orchestrators / load balancers.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Same-origin reverse proxy to the Smart Food backend. Serving the API on the
    # same origin as the Mini App avoids CORS entirely (BACKEND_API.md §D), so the
    # bearer-token transport needs no credentialed CORS.
    location /api/smartfood/ {
        proxy_pass              ${BACKEND_ORIGIN};
        proxy_http_version      1.1;
        proxy_set_header        Host              $proxy_host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        # Present correct SNI/Host to TLS backends (e.g. *.nip.io vhosts).
        proxy_ssl_server_name   on;
        proxy_connect_timeout   10s;
        proxy_read_timeout      30s;
    }

    # Fingerprinted assets — long-cache, immutable (matched before /webapp/).
    location /webapp/assets/ {
        alias       /usr/share/nginx/html/assets/;
        try_files   $uri =404;
        expires     1y;
        add_header  Cache-Control "public, immutable";
    }

    # Normalize the bare path so a shared "https://host/webapp" link still loads.
    location = /webapp { return 301 /webapp/; }

    # Mini App static bundle, served under /webapp/ (hash-router SPA).
    location /webapp/ {
        alias       /usr/share/nginx/html/;
        index       index.html;
        try_files   $uri $uri/ /webapp/index.html;
    }

    # Bare host -> the Mini App.
    location = / {
        return 302 /webapp/;
    }
}
